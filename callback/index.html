<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Tesla authorization code</title>
<style>
  body { font-family: -apple-system, system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; color: #222; }
  #code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 1.6rem; word-break: break-all; background: #f3f3f3; border: 1px solid #ccc; border-radius: 8px; padding: 16px; margin: 16px 0; user-select: all; }
  button { font-size: 1.2rem; padding: 12px 28px; border-radius: 8px; border: 0; background: #1a73e8; color: #fff; }
  .note { font-size: 1.1rem; margin-top: 20px; }
  .err { color: #b00020; }
  .muted { color: #666; font-size: 0.9rem; }
</style>
</head>
<body>
<h1>Tesla authorization</h1>
<div id="out"></div>
<script>
(function () {
  var p = new URLSearchParams(window.location.search);
  var code = p.get('code'), state = p.get('state'), err = p.get('error');
  var out = document.getElementById('out');
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; }
  if (code) {
    var c = el('div', null, code); c.id = 'code'; out.appendChild(c);
    var b = el('button', null, 'Copy'); out.appendChild(b);
    b.onclick = function () {
      function done() { b.textContent = 'Copied!'; setTimeout(function () { b.textContent = 'Copy'; }, 2000); }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(code).then(done, fallback);
      } else { fallback(); }
      function fallback() {
        var r = document.createRange(); r.selectNodeContents(c);
        var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
        try { document.execCommand('copy'); done(); } catch (e) { b.textContent = 'Select and copy manually'; }
      }
    };
    out.appendChild(el('p', 'note', 'Copy this code back to Grok Bot. It expires in a few minutes.'));
    if (state) out.appendChild(el('p', 'muted', 'State: ' + state));
  } else if (err) {
    out.appendChild(el('p', 'err', 'Tesla returned an error: ' + err + (p.get('error_description') ? ' - ' + p.get('error_description') : '')));
    out.appendChild(el('p', 'note', 'Tell Grok Bot about this error.'));
  } else {
    out.appendChild(el('p', 'note', 'No authorization code found in this link. Start the Tesla sign-in again from Grok Bot.'));
  }
})();
</script>
</body>
</html>
